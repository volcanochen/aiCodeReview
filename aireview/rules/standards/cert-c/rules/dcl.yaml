# CERT C — DCL 类别（自动生成后手工校订）
- id: DCL30-C
  name: 为对象声明合适的存储期
  severity: medium
  category: cert-c
  type: semantic
  language: c
  description: 返回指向局部变量的指针、或把局部变量地址交给调用方，都会在作用域结束后访问失效对象。
  rationale: CERT DCL30-C：对象的存储期必须覆盖其被访问的时间范围。
  fix_suggestion: 需要跨函数存活的对象改用 static、调用方传入的缓冲区或堆分配。
  tags:
  - DCL
  - semantic
  match:
    prompt: 判断该函数是否返回了指向自动存储期（局部变量）对象的指针，或把局部变量地址存入了会逃逸出作用域的位置（return &x、写入全局变量、写入输出参数）。若存在，violation=true，line 填相对函数开头的行偏移，message 说明哪个对象逃逸。不要因为函数内部使用了 & 就报违规。
    context:
      candidate_regex: return\s*&|return\s+\w+\s*;
      limit: 10
  references:
  - https://cmu-sei.github.io/secure-coding-standards/sei-cert-c-coding-standard/rules/declarations-and-initialization-dcl/
- id: DCL31-C
  name: 标识符必须先声明后使用
  severity: high
  category: cert-c
  type: semantic
  language: c
  description: 隐式声明（C89 允许、C99 起为约束违规）会让编译器按 int 返回值假设参数类型，是典型的类型混淆来源。
  rationale: CERT DCL31-C：使用未声明标识符属于约束违规。
  fix_suggestion: '补上缺失的 #include 或前置声明。'
  tags:
  - DCL
  - semantic
  match:
    prompt: 检查该函数是否调用了既未在本文件声明、也不属于常见标准库头（stdio/stdlib/string/unistd 等）的函数，即需要隐式声明才能编译的调用。若发现，violation=true，message 给出被调函数名。
    context:
      candidate_regex: \w+\s*\(
      limit: 10
  references:
  - https://cmu-sei.github.io/secure-coding-standards/sei-cert-c-coding-standard/rules/declarations-and-initialization-dcl/
- id: DCL36-C
  name: 不要声明链接属性冲突的标识符
  severity: medium
  category: cert-c
  type: regex
  language: c
  description: 同一标识符既以 extern 声明又以 static 定义，链接属性冲突会导致同一实体被当成两个对象。
  rationale: CERT DCL36-C：链接属性不一致属于未定义行为。
  fix_suggestion: 统一声明：要么全部 static，要么在头文件 extern、在单个 .c 中定义。
  tags:
  - DCL
  - heuristic
  match:
    pattern: extern\s+[^;\n]*\b(\w+)\s*\([^;]*\)\s*;[\s\S]{0,400}?^\s*static\s+[^;\n]*\b\1\s*\(
    message: 标识符同时以 extern 与 static 声明，链接属性冲突
    file_scope: &id001
      language: c
      path_glob: '*.c'
  references:
  - https://cmu-sei.github.io/secure-coding-standards/sei-cert-c-coding-standard/rules/declarations-and-initialization-dcl/
- id: DCL37-C
  name: 不要声明或定义保留标识符
  severity: medium
  category: cert-c
  type: regex
  language: c
  description: 以双下划线开头、或单下划线加大写字母开头的标识符由实现保留，用户代码占用会与标准库内部符号冲突。
  rationale: CERT DCL37-C：保留标识符可能被实现用作宏或内部符号。
  fix_suggestion: 改用不带前导下划线的自有命名，或使用项目统一前缀。
  tags:
  - DCL
  - auto
  match:
    pattern: ^\s*#\s*define\s+(__[A-Za-z0-9_]*|_[A-Z][A-Za-z0-9_]*)
    message: 定义了保留标识符 {{match}}
    file_scope: *id001
  references:
  - https://cmu-sei.github.io/secure-coding-standards/sei-cert-c-coding-standard/rules/declarations-and-initialization-dcl/
- id: DCL38-C
  name: 柔性数组成员声明语法必须正确
  severity: low
  category: cert-c
  type: regex
  language: c
  description: 柔性数组成员必须是结构体最后一个成员且不带长度；char buf[0]; 这类零长数组写法不可移植。
  rationale: CERT DCL38-C：柔性数组只能以 type name[]; 声明且必须是最后一个成员。
  fix_suggestion: 改为 char buf[];（C99 柔性数组），并确认它是结构体最后一个成员。
  tags:
  - DCL
  - auto
  match:
    pattern: \[\s*0\s*\]\s*;
    message: 疑似零长数组作为柔性数组成员，应使用 []
    file_scope: *id001
  references:
  - https://cmu-sei.github.io/secure-coding-standards/sei-cert-c-coding-standard/rules/declarations-and-initialization-dcl/
- id: DCL39-C
  name: 结构体跨信任边界传递时避免信息泄漏
  severity: medium
  category: cert-c
  type: semantic
  language: c
  description: 结构体填充字节里可能残留栈/堆旧数据，整体写出时会把敏感信息一并泄漏。
  rationale: CERT DCL39-C：结构体 padding 与未初始化部分的内容不确定。
  fix_suggestion: 逐字段序列化，或先 memset 清零再填充需要外发的字段。
  tags:
  - DCL
  - semantic
  match:
    prompt: 判断该函数是否把整个结构体（或 sizeof(结构体)）直接写入文件/套接字/网络缓冲区，且没有逐字段序列化或先清零。若存在，violation=true，message 指出泄漏位置。
    context:
      candidate_regex: \b(write|fwrite|send|sendto|memcpy)\s*\(
      limit: 10
  references:
  - https://cmu-sei.github.io/secure-coding-standards/sei-cert-c-coding-standard/rules/declarations-and-initialization-dcl/
- id: DCL40-C
  name: 不要为同一函数或对象创建不兼容声明
  severity: high
  category: cert-c
  type: semantic
  language: c
  description: 同一函数在不同位置给出不一致的参数或返回类型声明，调用点会按错误原型传参。
  rationale: CERT DCL40-C：不兼容声明属于约束违规。
  fix_suggestion: 把声明集中到唯一头文件，确保定义与所有声明一致。
  tags:
  - DCL
  - semantic
  match:
    prompt: 检查该文件中同一函数名是否出现参数列表或返回类型不一致的多个声明/定义。若存在，violation=true，message 列出冲突的签名。
    context:
      candidate_regex: \w+\s*\(
      limit: 10
  references:
  - https://cmu-sei.github.io/secure-coding-standards/sei-cert-c-coding-standard/rules/declarations-and-initialization-dcl/
- id: DCL41-C
  name: 不要在 switch 首个 case 之前声明变量
  severity: high
  category: cert-c
  type: regex
  language: c
  description: 'switch (x) { int i = 0; case 1: ... } 中变量声明位于首个 case 之前，跳转进入会绕过初始化，读到不确定值。'
  rationale: CERT DCL41-C：跳转到 case 标签会绕过声明处的初始化。
  fix_suggestion: 把变量声明移到 switch 之外，或在 case 之后用大括号建立独立作用域。
  tags:
  - DCL
  - auto
  match:
    pattern: switch\s*\([^)]*\)\s*\{(?:(?!\bcase\b|\bdefault\b)[\s\S])*?^\s*(?:[A-Za-z_]\w*[\s*\[]+)+[A-Za-z_]\w*\s*(?:=[^;]*)?;
    message: switch 首个 case 之前出现变量声明
    file_scope: *id001
  references:
  - https://cmu-sei.github.io/secure-coding-standards/sei-cert-c-coding-standard/rules/declarations-and-initialization-dcl/
- id: DCL42-C
  name: 使用 unsequenced/reproducible 属性前必须确认其真实成立
  severity: low
  category: cert-c
  type: semantic
  language: c
  description: 给函数标注 unsequenced（可重排、不依赖全局状态）或 reproducible（结果恒定）时，若实际不成立，优化器会做不安全变换。
  rationale: CERT DCL42-C：错误断言属性会改变程序语义。
  fix_suggestion: 只在函数确实无副作用、无全局/静态状态读写时才加这些属性。
  tags:
  - DCL
  - semantic
  match:
    prompt: 检查该函数是否带 unsequenced / reproducible 属性（C23）但实际读写了全局或静态变量、或调用了非纯函数。若存在，violation=true，message 说明哪条假设不成立。
    context:
      candidate_regex: unsequenced|reproducible
      limit: 10
  references:
  - https://cmu-sei.github.io/secure-coding-standards/sei-cert-c-coding-standard/rules/declarations-and-initialization-dcl/
