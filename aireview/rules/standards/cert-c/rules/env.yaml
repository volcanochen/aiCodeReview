# CERT C — ENV 类别
- id: ENV30-C
  name: 不要修改特定函数返回的对象
  severity: medium
  category: cert-c
  type: regex
  language: c
  description: getenv/strerror/localeconv 返回的指针可能指向库内部静态缓冲区，写入会破坏全局状态。
  rationale: CERT ENV30-C：这些返回值是只读的。
  fix_suggestion: 需要修改就先 strdup 一份副本。
  tags:
  - ENV
  - heuristic
  match:
    pattern: \b(?:getenv|strerror|localeconv|asctime|localtime|gmtime)\s*\([^;]*\)\s*(?:\[[^\]]*\])?\s*=[^=]
    message: 直接修改库函数返回的内部缓冲区
    file_scope: &id001
      language: c
      path_glob: '*.c'
  references:
  - https://cmu-sei.github.io/secure-coding-standards/sei-cert-c-coding-standard/rules/environment-env/
- id: ENV31-C
  name: 环境指针在可能失效的操作后不可继续使用
  severity: medium
  category: cert-c
  type: semantic
  language: c
  description: setenv/putenv/unsetenv 可能重新分配 environ，之前保存的 char** 指针会失效。
  rationale: CERT ENV31-C：环境操作可能使旧指针失效。
  fix_suggestion: 每次重新调用 getenv，不要长期缓存 environ 指针。
  tags:
  - ENV
  - semantic
  match:
    prompt: 判断该函数是否缓存了 environ 或 getenv 的返回指针，并在 setenv/putenv/unsetenv 之后继续使用。若存在，violation=true。
    context:
      candidate_regex: \b(getenv|setenv|putenv|unsetenv|environ)\b
      limit: 10
  references:
  - https://cmu-sei.github.io/secure-coding-standards/sei-cert-c-coding-standard/rules/environment-env/
- id: ENV32-C
  name: 退出处理函数必须正常返回
  severity: medium
  category: cert-c
  type: semantic
  language: c
  description: atexit 注册的函数若调用 exit/longjmp 或抛异常，行为未定义。
  rationale: CERT ENV32-C：退出处理函数必须正常 return。
  fix_suggestion: 退出处理函数里只做清理，不要再次 exit 或跳转。
  tags:
  - ENV
  - semantic
  match:
    prompt: 判断该 atexit 注册的处理函数是否调用了 exit/_exit/longjmp 或可能抛出异常。若存在，violation=true。
    context:
      candidate_regex: \batexit\s*\(
      limit: 10
  references:
  - https://cmu-sei.github.io/secure-coding-standards/sei-cert-c-coding-standard/rules/environment-env/
- id: ENV33-C
  name: 不要调用 system()
  severity: critical
  category: cert-c
  type: regex
  language: c
  description: system() 通过 shell 执行命令，命令串一旦含用户输入即可被注入任意命令；且信号处理期间调用不安全。
  rationale: CERT ENV33-C：system() 会引入命令注入面。
  fix_suggestion: 用 fork+exec 直接执行程序并显式传参；必须用时严格校验输入。
  tags:
  - ENV
  - heuristic
  match:
    pattern: \bsystem\s*\(
    message: 调用了 system()，存在命令注入风险
    file_scope: *id001
  references:
  - https://cmu-sei.github.io/secure-coding-standards/sei-cert-c-coding-standard/rules/environment-env/
- id: ENV34-C
  name: 不要保存特定函数的返回指针
  severity: medium
  category: cert-c
  type: semantic
  language: c
  description: getenv/strerror/localeconv/setlocale 的返回指针可能在下一次调用时被覆盖。
  rationale: CERT ENV34-C：这些函数的返回值不保证长期有效。
  fix_suggestion: 立即复制到自有缓冲区再保存。
  tags:
  - ENV
  - semantic
  match:
    prompt: 判断该函数是否把 getenv/strerror/localeconv 的返回指针存入全局、结构体或长期变量。若存在，violation=true。
    context:
      candidate_regex: \b(getenv|strerror|localeconv|setlocale)\s*\(
      limit: 10
  references:
  - https://cmu-sei.github.io/secure-coding-standards/sei-cert-c-coding-standard/rules/environment-env/
