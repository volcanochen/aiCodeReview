# CERT C — automated subset. Each rule maps to a SEI CERT C recommendation.
# Types: ast_pattern (tree-sitter), regex (text), graph (cross-module), semantic (LLM).
- id: cert-c-fio34
  name: "Do not use gets()"
  severity: high
  category: cert-c
  type: ast_pattern
  language: c
  description: "禁止在 C 中使用 gets()，它无法限制读取长度，必然导致缓冲区溢出。"
  rationale: "FIO34-C: The gets() function does not check bounds."
  fix_suggestion: "改用 fgets(buf, sizeof(buf), stdin) 并校验返回值。"
  enabled: true
  match:
    query: '(call_expression function: (identifier) @name (#eq? @name "gets")) @node'
    message: "使用了已废弃且不安全的 gets()（FIO34-C），存在缓冲区溢出风险"
  references: ["https://wiki.sei.cmu.edu/confluence/display/c/FIO34-C"]

- id: cert-c-str31
  name: "Do not copy strings without bounds checking"
  severity: medium
  category: cert-c
  type: ast_pattern
  language: c
  description: "strcpy/strcat/sprintf 等不检查目标缓冲区边界，容易导致溢出。"
  rationale: "STR31-C / STR32-C: Guarantee that string/character copying is bounded."
  fix_suggestion: "改用 strncpy/strncat/snprintf 等带长度限制的接口，并确保 null 终止。"
  enabled: true
  match:
    query: '(call_expression function: (identifier) @name (#match? @name "^(strcpy|strcat|sprintf|vsprintf)$")) @node'
    message: "使用了缺少边界检查的字符串/格式化函数 {{name}}（STR31-C/STR32-C）"
  references: ["https://wiki.sei.cmu.edu/confluence/display/c/STR31-C"]

- id: cert-c-str32
  name: "strncpy may not null-terminate"
  severity: medium
  category: cert-c
  type: ast_pattern
  language: c
  description: "strncpy 在源串长度 >= 计数时不会写入终止 null，可能产生非终止字符串。"
  rationale: "STR32-C: Null-terminate byte strings."
  fix_suggestion: "调用后手动在末尾补 '\\0'，或优先使用 snprintf。"
  enabled: true
  match:
    query: '(call_expression function: (identifier) @name (#eq? @name "strncpy")) @node'
    message: "strncpy 可能不会以 null 终止目标缓冲区（STR32-C），请手动补 \\0"
  references: ["https://wiki.sei.cmu.edu/confluence/display/c/STR32-C"]

- id: cert-c-env34
  name: "Do not use system() with non-constant command"
  severity: medium
  category: cert-c
  type: ast_pattern
  language: c
  description: "system() 以非常量命令调用存在命令注入风险，应避免或严格校验参数。"
  rationale: "ENV34-C: Do not use system() with a non-constant command string."
  fix_suggestion: "避免拼接用户输入到命令；如必须使用，校验并白名单化参数。"
  enabled: true
  match:
    query: '(call_expression function: (identifier) @name (#eq? @name "system")) @node'
    message: "调用了 system()（ENV34-C），请确认命令参数为常量或已严格校验"
  references: ["https://wiki.sei.cmu.edu/confluence/display/c/ENV34-C"]

- id: cert-c-msc30
  name: "Do not use rand() for security"
  severity: medium
  category: cert-c
  type: ast_pattern
  language: c
  description: "rand()/srand() 生成的序列可预测，不适用于安全用途。"
  rationale: "MSC30-C / MSC31-C: Do not use deprecated or predictable random number generators."
  fix_suggestion: "使用密码学安全随机数（如 platform-specific CSPRNG）。"
  enabled: true
  match:
    query: '(call_expression function: (identifier) @name (#match? @name "^(rand|srand)$")) @node'
    message: "rand()/srand() 不适合安全用途（MSC30-C），请改用 CSPRNG"
  references: ["https://wiki.sei.cmu.edu/confluence/display/c/MSC30-C"]

- id: cert-c-msc33
  name: "Do not use time() for security"
  severity: low
  category: cert-c
  type: ast_pattern
  language: c
  description: "time() 分辨率低且可预测，不应作为安全随机种子。"
  rationale: "MSC33-C: Do not use time() for security purposes."
  fix_suggestion: "使用专用的随机数源作为种子。"
  enabled: true
  match:
    query: '(call_expression function: (identifier) @name (#eq? @name "time")) @node'
    message: "time() 不适合安全用途（MSC33-C），请勿用作安全随机种子"
  references: ["https://wiki.sei.cmu.edu/confluence/display/c/MSC33-C"]

- id: cert-c-tmp
  name: "Avoid tmpnam()/mktemp()"
  severity: low
  category: cert-c
  type: ast_pattern
  language: c
  description: "tmpnam/mktemp 存在 TOCTOU 与确定性文件名风险。"
  rationale: "FILE... / POS... : use mkstemp() instead."
  fix_suggestion: "改用 mkstemp() 等安全临时文件接口。"
  enabled: true
  match:
    query: '(call_expression function: (identifier) @name (#match? @name "^(tmpnam|mktemp)$")) @node'
    message: "tmpnam/mktemp 不安全（存在竞争与可预测文件名风险），建议 mkstemp()"
  references: ["https://wiki.sei.cmu.edu/confluence/display/c/POS01-C"]

- id: cert-c-con35
  name: "strtok is not reentrant"
  severity: medium
  category: cert-c
  type: regex
  language: c
  description: "strtok 使用内部静态状态，多线程下存在数据竞争。"
  rationale: "CON35-C / CON30-C: Avoid data races; strtok is not thread-safe."
  fix_suggestion: "改用可重入版本 strtok_r / strtok_s。"
  enabled: true
  match:
    pattern: "strtok\\s*\\("
    file_scope: { language: c }
    message: "strtok 不是可重入的（CON35-C），多线程下存在数据竞争，建议 strtok_r"
  references: ["https://wiki.sei.cmu.edu/confluence/display/c/CON35-C"]

- id: cert-c-fio-scanf
  name: "scanf %s without width"
  severity: medium
  category: cert-c
  type: regex
  language: c
  description: "scanf 族函数格式串含 %s 且未指定宽度时可能溢出目标缓冲区。"
  rationale: "STR31-C / FIO... : bound string reads from formatted input."
  fix_suggestion: "为 %s 指定宽度（如 %31s）或改用 fgets + sscanf。"
  enabled: true
  match:
    pattern: "scanf\\s*\\([^)]*%s"
    file_scope: { language: c }
    message: "scanf 格式串含未限宽的 %s（STR31-C），存在缓冲区溢出风险"
  references: ["https://wiki.sei.cmu.edu/confluence/display/c/STR31-C"]

- id: cert-c-con33
  name: "Signal handler must call only async-signal-safe functions"
  severity: high
  category: cert-c
  type: graph
  language: c
  description: >-
    在信号处理函数（通过 signal()/sigaction() 注册，或其 sa_handler 赋值）中，
    只能调用异步信号安全函数。本规则基于跨模块调用图展开处理函数的调用链，
    检测其中是否出现 malloc/free/printf/strcpy/rand 等非安全函数。
  rationale: "CON33-C / SIG30-C / SIG31-C: do not call non-async-signal-safe functions from a signal handler."
  fix_suggestion: "将非安全操作移出信号处理函数，仅设置标志位 (volatile sig_atomic_t) 供主循环处理。"
  enabled: true
  match:
    analyzer: signal_safety
    params: { max_depth: 8 }
  references: ["https://wiki.sei.cmu.edu/confluence/display/c/SIG30-C"]

- id: cert-c-exp34
  name: "Do not dereference null pointers"
  severity: high
  category: cert-c
  type: semantic
  language: c
  description: "检测函数是否在未对指针做空值检查的情况下解引用（可能为 NULL 的返回值如 malloc/fopen）。"
  rationale: "EXP34-C: Do not dereference null pointers."
  fix_suggestion: "在使用指针前增加空值检查并返回/处理错误。"
  enabled: true
  match:
    prompt: >-
      判断该函数是否在缺少空值检查的情况下解引用了可能为 NULL 的指针
      （例如 malloc/fopen/realloc 的返回值，或函数参数指针）。仅当确有可能解引用 NULL 时才报告。
    context: { candidate_regex: "malloc|fopen|realloc", limit: 30 }
  references: ["https://wiki.sei.cmu.edu/confluence/display/c/EXP34-C"]
