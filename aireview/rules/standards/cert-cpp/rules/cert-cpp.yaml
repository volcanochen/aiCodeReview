# CERT C++ — scaffold pack (a few representative rules).
- id: cert-cpp-msc50
  name: "Do not use std::rand()"
  severity: medium
  category: cert-cpp
  type: ast_pattern
  language: cpp
  description: "std::rand() 序列可预测，C++ 应使用 <random> 中的设施。"
  rationale: "MSC50-CPP / MSC51-CPP: do not use std::rand() for security."
  fix_suggestion: "使用 <random> 中的 std::mt19937 等分布与引擎。"
  enabled: true
  match:
    query: '(call_expression function: (qualified_identifier scope: (namespace_identifier) @ns name: (identifier) @name (#eq? @ns "std") (#eq? @name "rand"))) @node'
    message: "使用了 std::rand()（MSC50-CPP），建议改用 <random>"
  references: ["https://wiki.sei.cmu.edu/confluence/display/cplusplus/MSC50-CPP"]

- id: cert-cpp-err
  name: "Catch exceptions by reference"
  severity: low
  category: cert-cpp
  type: regex
  language: cpp
  description: "按值捕获异常会产生切片且代价高，应始终按引用（const T&）捕获。"
  rationale: "ERR... / OOP: catch by reference, not by value."
  fix_suggestion: "将 catch (Exception e) 改为 catch (const Exception& e)。"
  enabled: true
  match:
    pattern: "catch\\s*\\(\\s*(?!const\\b)[A-Za-z_][\\w:]*\\s+[A-Za-z_]\\w*\\s*\\)"
    file_scope: { language: cpp }
    message: "建议按引用捕获异常（const T&），避免对象切片（catch by value）"
  references: ["https://wiki.sei.cmu.edu/confluence/display/cplusplus/ERR09-CPP"]
