# JavaScript 编码标准包 — 常见反模式与安全隐患（regex 类型，适用于 .js/.ts）
- id: js-var
  name: 使用 let/const 代替 var
  severity: low
  category: javascript
  type: regex
  language: javascript
  description: var 是函数作用域且会提升，容易产生意料之外的覆盖。
  rationale: ES6 起推荐块级作用域的 let/const。
  fix_suggestion: 改用 let（需重新赋值）或 const（不重新赋值）。
  tags:
  - style
  - core
  match:
    pattern: ^\s*var\s+\w+
    message: 使用了 var，建议改为 let/const
    file_scope: &id001
      language: javascript
      path_glob: '*.js'
  references: []
- id: js-eqeq
  name: 使用 === 代替 ==
  severity: medium
  category: javascript
  type: regex
  language: javascript
  description: == 会做隐式类型转换，[] == false、'' == 0 等结果违反直觉。
  rationale: 严格相等避免类型转换带来的意外。
  fix_suggestion: 改用 === / !==；确需宽松比较时显式转换后比较。
  tags:
  - bugs
  - core
  match:
    pattern: '[^=!<>]==[^=]|!=[^=]'
    message: 使用了宽松相等，建议 === / !==
    file_scope: *id001
  references: []
- id: js-eval
  name: 避免 eval / new Function
  severity: high
  category: javascript
  type: regex
  language: javascript
  description: eval 与 new Function 执行任意字符串代码，输入不可信时等同 RCE。
  rationale: 动态求值绕过 CSP 与静态检查。
  fix_suggestion: 改用显式映射表、JSON.parse 或模板渲染。
  tags:
  - security
  - core
  match:
    pattern: \beval\s*\(|new\s+Function\s*\(
    message: 动态执行字符串代码
    file_scope: *id001
  references: []
- id: js-with
  name: 不要使用 with
  severity: medium
  category: javascript
  type: regex
  language: javascript
  description: with 会把作用域链变模糊，且在严格模式下被禁止。
  rationale: with 让标识符解析不可预测。
  fix_suggestion: 改为显式对象属性访问或解构赋值。
  tags:
  - bugs
  match:
    pattern: ^\s*with\s*\(
    message: 使用了 with 语句
    file_scope: *id001
  references: []
- id: js-console-log
  name: 生产代码避免 console.log
  severity: info
  category: javascript
  type: regex
  language: javascript
  description: console 输出会泄漏内部状态，且在生产环境通常应移除。
  rationale: 调试输出不应进入生产构建。
  fix_suggestion: 改用统一日志库（并按级别控制），或构建时剔除。
  tags:
  - style
  match:
    pattern: \bconsole\.(log|debug|info)\s*\(
    message: 遗留 console 输出
    file_scope: *id001
  references: []
- id: js-debugger
  name: 不要遗留 debugger
  severity: high
  category: javascript
  type: regex
  language: javascript
  description: debugger 语句会让调试器开启时暂停执行。
  rationale: 遗留 debugger 会阻塞用户。
  fix_suggestion: 删除 debugger 语句。
  tags:
  - bugs
  - core
  match:
    pattern: ^\s*debugger\s*;?\s*$
    message: 遗留 debugger 语句
    file_scope: *id001
  references: []
- id: js-innerhtml-xss
  name: innerHTML 存在 XSS 风险
  severity: high
  category: javascript
  type: regex
  language: javascript
  description: 把不可信内容赋给 innerHTML 会解析其中的 HTML/脚本。
  rationale: innerHTML 不转义，是 DOM XSS 的常见入口。
  fix_suggestion: 改用 textContent，或用经过消毒的库（DOMPurify）。
  tags:
  - security
  - core
  match:
    pattern: \.innerHTML\s*=
    message: 直接设置 innerHTML，注意 XSS
    file_scope: *id001
  references: []
- id: js-document-write
  name: 避免 document.write
  severity: medium
  category: javascript
  type: regex
  language: javascript
  description: document.write 会重写整个文档，且在异步加载后失效。
  rationale: document.write 破坏解析流程。
  fix_suggestion: 改用 DOM API 插入节点。
  tags:
  - bugs
  match:
    pattern: \bdocument\.write(ln)?\s*\(
    message: 使用 document.write
    file_scope: *id001
  references: []
- id: js-settimeout-string
  name: setTimeout 不要传字符串
  severity: medium
  category: javascript
  type: regex
  language: javascript
  description: 传字符串会被隐式 eval，等价于动态代码执行。
  rationale: 字符串形式等同于 eval。
  fix_suggestion: 改传函数引用。
  tags:
  - security
  - core
  match:
    pattern: \bset(?:Timeout|Interval)\s*\(\s*[\"']
    message: setTimeout 接收字符串参数（隐式 eval）
    file_scope: *id001
  references: []
- id: js-for-var
  name: 循环中不要用 var 捕获变量
  severity: medium
  category: javascript
  type: regex
  language: javascript
  description: var 是函数作用域，闭包捕获到的是循环结束后的同一个变量。
  rationale: 块级作用域才能让每次迭代独立绑定。
  fix_suggestion: 改用 let。
  tags:
  - bugs
  match:
    pattern: for\s*\(\s*var\s+\w+
    message: for 循环使用 var，闭包会共享同一变量
    file_scope: *id001
  references: []
- id: js-hardcoded-secret
  name: 不要硬编码敏感信息
  severity: critical
  category: javascript
  type: regex
  language: javascript
  description: 源码里的密钥/口令会随前端包直接下发到浏览器。
  rationale: 前端代码无法保密。
  fix_suggestion: 改为由后端下发短期令牌，或使用密钥管理服务。
  tags:
  - security
  - core
  match:
    pattern: (?i)\b(password|passwd|secret|api[_-]?key|access[_-]?key|token)\s*[:=]\s*['\"][^'\"]{3,}['\"]
    message: 疑似硬编码敏感信息
    file_scope: *id001
  references: []
- id: js-child-process
  name: 避免 child_process 执行拼接命令
  severity: high
  category: javascript
  type: regex
  language: javascript
  description: exec 会把字符串交给 shell，拼接用户输入即命令注入。
  rationale: shell 解释会执行注入的分隔符与子命令。
  fix_suggestion: 改用 execFile/spawn 传参数数组，不使用 shell。
  tags:
  - security
  - core
  match:
    pattern: \bchild_process\b|\bexec(Sync)?\s*\(\s*[`'\"]
    message: 通过 shell 执行命令，注意注入
    file_scope: *id001
  references: []
- id: js-dynamic-regexp
  name: 不要用变量构造正则
  severity: high
  category: javascript
  type: regex
  language: javascript
  description: new RegExp(userInput) 可被构造出灾难性回溯或绕过校验。
  rationale: 动态正则让输入控制匹配语义。
  fix_suggestion: 用固定正则 + 转义函数，或改用字符串方法。
  tags:
  - security
  match:
    pattern: new\s+RegExp\s*\(\s*[A-Za-z_$]
    message: 用变量构造正则表达式
    file_scope: *id001
  references: []
- id: js-prototype-pollution
  name: 不要写入 __proto__/prototype
  severity: critical
  category: javascript
  type: regex
  language: javascript
  description: 向 __proto__ 或 Object.prototype 写入可污染所有对象。
  rationale: 原型链被污染后影响全局对象行为。
  fix_suggestion: 用 Object.create(null) 或 Map；合并对象时校验键名（拒绝 __proto__/constructor）。
  tags:
  - security
  - core
  match:
    pattern: \.__proto__\s*=|\[\s*['\"]__proto__['\"]\s*\]\s*=|Object\.prototype\.\w+\s*=
    message: 写入原型链，存在原型污染风险
    file_scope: *id001
  references: []
- id: js-weak-random
  name: 安全场景不要用 Math.random
  severity: high
  category: javascript
  type: regex
  language: javascript
  description: Math.random 不是密码学安全随机源，可被预测。
  rationale: 令牌、验证码等必须用 CSPRNG。
  fix_suggestion: 改用 crypto.randomUUID() / crypto.getRandomValues()。
  tags:
  - security
  - core
  match:
    pattern: Math\.random\s*\(\s*\)
    message: 使用 Math.random，不适合安全用途
    file_scope: *id001
  references: []
- id: js-target-blank
  name: target=_blank 需加 rel=noopener
  severity: medium
  category: javascript
  type: regex
  language: javascript
  description: 未加 rel=noopener 时新页面可通过 window.opener 操作原页面。
  rationale: 反向标签劫持（tabnabbing）。
  fix_suggestion: 加上 rel="noopener noreferrer"。
  tags:
  - security
  match:
    pattern: target\s*=\s*['\"]_blank['\"](?![^>]*rel\s*=\s*['\"][^'\"]*noopener)
    message: target=_blank 缺少 rel=noopener
    file_scope: *id001
  references: []
- id: js-parseint-radix
  name: parseInt 应显式指定基数
  severity: medium
  category: javascript
  type: regex
  language: javascript
  description: 不传基数时 '08' 之类的旧实现会按八进制解析。
  rationale: 显式基数保证解析结果可预期。
  fix_suggestion: 写成 parseInt(s, 10)。
  tags:
  - bugs
  - core
  match:
    pattern: \bparseInt\s*\(\s*[^,)]+\)
    message: parseInt 未指定基数
    file_scope: *id001
  references: []
- id: js-isnan-global
  name: 优先使用 Number.isNaN
  severity: low
  category: javascript
  type: regex
  language: javascript
  description: 全局 isNaN 会先做类型转换，'abc' 也会被判为 NaN。
  rationale: Number.isNaN 只对真正的 NaN 返回 true。
  fix_suggestion: 改用 Number.isNaN(x)。
  tags:
  - bugs
  match:
    pattern: (?<!\.)\bisNaN\s*\(
    message: 使用全局 isNaN，建议 Number.isNaN
    file_scope: *id001
  references: []
- id: js-insecure-http
  name: 不要硬编码 http:// 地址
  severity: medium
  category: javascript
  type: regex
  language: javascript
  description: 明文 HTTP 会被中间人读取或篡改。
  rationale: 传输必须加密。
  fix_suggestion: 改用 https://，或从配置注入地址。
  tags:
  - security
  match:
    pattern: '[''\"]http://(?!localhost|127\.0\.0\.1)'
    message: 硬编码明文 HTTP 地址
    file_scope: *id001
  references: []
- id: js-cors-wildcard
  name: CORS 不要放开为 *
  severity: high
  category: javascript
  type: regex
  language: javascript
  description: 'Access-Control-Allow-Origin: * 允许任意站点读取响应。'
  rationale: 通配符配合凭据时等同于放弃同源保护。
  fix_suggestion: 改为白名单校验 Origin 后回显具体来源。
  tags:
  - security
  - core
  match:
    pattern: Access-Control-Allow-Origin['\"]?\s*[,:]\s*['\"]\*
    message: CORS 允许任意来源
    file_scope: *id001
  references: []
- id: js-sql-concat
  name: 不要拼接 SQL 字符串
  severity: high
  category: javascript
  type: regex
  language: javascript
  description: 查询语句拼接变量会被注入。
  rationale: 参数化查询才能把数据与语句分离。
  fix_suggestion: 改用占位符 + 参数数组。
  tags:
  - security
  - core
  match:
    pattern: (?i)(?:query|execute)\s*\(\s*[`'\"][^`'\"]*(?:SELECT|INSERT|UPDATE|DELETE)[^`'\"]*['\"`]\s*\+
    message: SQL 语句由字符串拼接
    file_scope: *id001
  references: []
- id: js-document-cookie
  name: 谨慎使用 document.cookie
  severity: medium
  category: javascript
  type: regex
  language: javascript
  description: 未加 HttpOnly/Secure 的 cookie 可被脚本读取，易受 XSS 窃取。
  rationale: 敏感凭据应放在 HttpOnly cookie 或内存中。
  fix_suggestion: 由后端 Set-Cookie 并加 HttpOnly、Secure、SameSite。
  tags:
  - security
  match:
    pattern: \bdocument\.cookie\s*=
    message: 脚本写入 cookie，注意敏感信息泄漏
    file_scope: *id001
  references: []
- id: js-weak-hash
  name: 不要用 MD5/SHA1 做安全摘要
  severity: high
  category: javascript
  type: regex
  language: javascript
  description: MD5/SHA1 已可构造碰撞，不能用于签名或口令存储。
  rationale: 碰撞攻击可伪造摘要结果。
  fix_suggestion: 改用 SHA-256 及以上的哈希；口令用 bcrypt/scrypt/argon2。
  tags:
  - security
  - core
  match:
    pattern: createHash\s*\(\s*['\"](?:md5|sha1)['\"]
    message: 使用弱哈希算法
    file_scope: *id001
  references: []
- id: js-alert
  name: 生产代码不要用 alert
  severity: info
  category: javascript
  type: regex
  language: javascript
  description: alert/confirm 会阻塞主线程且无法定制，属于调试残留。
  rationale: 阻塞式弹窗不应出现在产品代码。
  fix_suggestion: 改用页面内的提示组件。
  tags:
  - style
  match:
    pattern: \b(?:alert|confirm)\s*\(
    message: 使用阻塞式弹窗
    file_scope: *id001
  references: []
- id: js-todo-comment
  name: 遗留 TODO/FIXME
  severity: info
  category: javascript
  type: regex
  language: javascript
  description: 未完成的标记应进入任务系统。
  rationale: 长期堆积的 TODO 会被遗忘。
  fix_suggestion: 转为 issue 并在此引用编号。
  tags:
  - style
  match:
    pattern: (?i)//\s*(TODO|FIXME|XXX|HACK)\b
    message: 遗留 TODO/FIXME
    file_scope: *id001
  references: []
- id: js-then-without-catch
  name: Promise 调用需处理拒绝
  severity: medium
  category: javascript
  type: regex
  language: javascript
  description: 没有 catch/第二个参数的 then 链会吞掉拒绝，变成 unhandled rejection。
  rationale: 未处理的 rejection 会导致进程告警或状态不一致。
  fix_suggestion: 追加 .catch(...)，或改用 async/await + try/catch。
  tags:
  - reliability
  - core
  match:
    pattern: \.then\s*\((?![^\n]*\.catch)[^\n]*\)\s*;
    message: then 链未处理 rejection
    file_scope: *id001
  references: []
